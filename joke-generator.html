<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.2em;
            color: #555;
            line-height: 1.6;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
        }

        .button-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        .category-buttons button {
            padding: 8px 16px;
            font-size: 0.9em;
            background: #e0e0e0;
            color: #333;
        }

        .category-buttons button:hover {
            background: #667eea;
            color: white;
        }

        .category-buttons button.active {
            background: #667eea;
            color: white;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        
        <div class="category-buttons">
            <button class="category-btn active" data-category="Any">Any</button>
            <button class="category-btn" data-category="General">General</button>
            <button class="category-btn" data-category="Programming">Programming</button>
            <button class="category-btn" data-category="Knock-knock">Knock-knock</button>
        </div>

        <div class="joke-box">
            <div class="joke-text" id="jokeDisplay">
                Click "Get Joke" to load a random joke!
            </div>
        </div>

        <div class="button-container">
            <button id="getJokeBtn">Get Joke</button>
            <button id="newJokeBtn">New Joke</button>
        </div>

        <div class="footer">
            Powered by JokeAPI
        </div>
    </div>

    <script>
        let selectedCategory = 'Any';
        const jokeDisplay = document.getElementById('jokeDisplay');
        const getJokeBtn = document.getElementById('getJokeBtn');
        const newJokeBtn = document.getElementById('newJokeBtn');
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Category button event listeners
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                categoryButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedCategory = this.dataset.category;
            });
        });

        // Fetch joke from API
        async function getJoke() {
            jokeDisplay.innerHTML = '<div class="loading">Loading joke...</div>';
            
            try {
                let url = 'https://v2.jokeapi.dev/joke/';
                
                if (selectedCategory === 'Any') {
                    url += 'Any';
                } else {
                    url += selectedCategory;
                }

                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                if (data.type === 'single') {
                    // Single line joke
                    jokeDisplay.innerHTML = `<div class="joke-text">${data.joke}</div>`;
                } else if (data.type === 'twopart') {
                    // Two-part joke
                    jokeDisplay.innerHTML = `
                        <div class="joke-text">
                            <strong>Q:</strong> ${data.setup}<br><br>
                            <strong>A:</strong> ${data.delivery}
                        </div>
                    `;
                } else {
                    throw new Error('Unknown joke type');
                }
            } catch (error) {
                jokeDisplay.innerHTML = `<div class="error">Oops! Could not fetch a joke. Please try again!</div>`;
                console.error('Error:', error);
            }
        }

        // Event listeners
        getJokeBtn.addEventListener('click', getJoke);
        newJokeBtn.addEventListener('click', getJoke);

        // Load a joke on page load
        window.addEventListener('load', getJoke);
    </script>
</body>
</html>
